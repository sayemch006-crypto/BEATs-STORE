<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beat Catalog — Original Production</title>
<meta name="description" content="Browse original beats, preview instantly, and license the one you want over WhatsApp." />
<meta property="og:title" content="Beat Catalog — Original Production" />
<meta property="og:description" content="Browse original beats, preview instantly, and license the one you want over WhatsApp." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#120F16" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23120F16'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%23E8A33D'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #120F16;
    --bg-vignette: #1A1420;
    --surface: #1E1822;
    --surface-hover: #262030;
    --border: #332B3D;
    --text: #F3EEEA;
    --text-muted: #AFA3BA;
    --text-dim: #726780;
    --gold: #E8A33D;
    --gold-bg: rgba(232,163,61,0.14);
    --violet: #A48EE8;
    --violet-bg: rgba(164,142,232,0.14);
    --red: #E8483A;
    --red-bg: rgba(232,72,58,0.14);
    --radius-sm: 4px;
    --radius-md: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Manrope', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --container: 1180px;
  }

  * { box-sizing: border-box; }
  h1, h2, h3, p { margin: 0; }

  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    margin: 0;
    background: radial-gradient(ellipse 1200px 700px at 50% -10%, var(--bg-vignette), var(--bg) 60%);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  img, svg { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .container {
    max-width: var(--container);
    margin-inline: auto;
    padding-inline: clamp(1.25rem, 4vw, 3rem);
  }

  /* ---------- NAV ---------- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem clamp(1.25rem, 4vw, 3rem);
    background: rgba(18,15,22,0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .nav-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
  }
  .nav-contact {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    transition: border-color .2s ease, color .2s ease;
  }
  .nav-contact:hover { border-color: var(--gold); color: var(--gold); }
  .nav-contact svg { width: 14px; height: 14px; fill: currentColor; }

  /* ---------- HERO ---------- */
  .hero { padding-block: clamp(3.5rem, 9vw, 6rem) clamp(2rem, 5vw, 3rem); text-align: center; }
  .hero-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.25rem;
  }
  .hero-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.75rem, 9vw, 5.5rem);
    line-height: 0.98;
    letter-spacing: -0.02em;
  }
  .hero-tagline {
    max-width: 46ch;
    margin: 1.25rem auto 0;
    color: var(--text-muted);
    font-size: clamp(1rem, 2vw, 1.15rem);
  }
  .hero-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.75rem;
    padding: 0.7rem 1.4rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: border-color .2s ease, color .2s ease, transform .2s ease;
  }
  .hero-cta:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }

  .hero-wave {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
    height: 56px;
    margin-top: clamp(2.5rem, 6vw, 4rem);
  }
  .wave-bar {
    width: 4px;
    min-height: 8%;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--gold), var(--red));
    transform-origin: bottom center;
    animation: wavePulse ease-in-out infinite alternate;
  }
  @keyframes wavePulse { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .wave-bar { animation: none; } }

  /* ---------- FILTERS ---------- */
  #browseSection { scroll-margin-top: 84px; }
  .filters-section { padding-block: 1.5rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .filters-row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
  .filter-btn {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    transition: all .2s ease;
  }
  .filter-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .filter-btn.active { background: var(--gold); border-color: var(--gold); color: var(--bg); }
  .result-count {
    margin-top: 0.9rem;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }

  /* ---------- CATALOG GRID ---------- */
  .catalog-section { padding-block: clamp(2rem, 5vw, 3.5rem); }
  .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1.5rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--text-dim); box-shadow: 0 20px 40px -20px rgba(0,0,0,0.6); }
  .card[data-status="sold"] .cover { filter: grayscale(0.4) brightness(0.75); }
  .card[data-status="sold"] .title { color: var(--text-muted); }


  .cover {
    position: relative;
    aspect-ratio: 1 / 1;
    background-image: repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,0.16) 0, rgba(0,0,0,0.16) 1px, transparent 1px, transparent 8px);
  }
  .tag-code, .tag-status {
    position: absolute;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    padding: 0.28rem 0.55rem;
    border-radius: var(--radius-sm);
  }
  .tag-code { top: 0.7rem; left: 0.7rem; background: rgba(0,0,0,0.5); color: var(--text); }
  .tag-status { top: 0.7rem; right: 0.7rem; border: 1px solid transparent; }
  .tone-gold { background: var(--gold-bg); color: var(--gold); border-color: rgba(232,163,61,0.4); }
  .tone-red { background: var(--red-bg); color: var(--red); border-color: rgba(232,72,58,0.4); }

  .play-btn {
    position: absolute;
    bottom: 0.85rem; left: 0.85rem;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(18,15,22,0.75);
    border: 1px solid rgba(255,255,255,0.16);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    transition: background .2s ease, transform .2s ease;
  }
  .play-btn:hover { background: var(--gold); border-color: var(--gold); transform: scale(1.06); }
  .play-btn:hover svg { fill: var(--bg); }
  .play-btn svg { width: 16px; height: 16px; fill: var(--text); }

  .no-preview-msg {
    position: absolute;
    bottom: 0.85rem; left: 3.7rem; right: 0.85rem;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text);
    background: rgba(0,0,0,0.65);
    padding: 0.3rem 0.55rem;
    border-radius: var(--radius-sm);
    opacity: 0;
    transition: opacity .2s ease;
    pointer-events: none;
    text-align: center;
  }
  .no-preview-msg.show { opacity: 1; }

  .card-body { padding: 1.1rem 1.15rem 1.25rem; }
  .title { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; margin-bottom: 0.35rem; }
  .meta { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); letter-spacing: 0.02em; margin-bottom: 1rem; }

  .player-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.1rem; }
  .progress { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--gold); }
  .time { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-dim); min-width: 2.4em; text-align: right; font-variant-numeric: tabular-nums; }

  .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .price { font-family: var(--font-mono); font-weight: 600; font-size: 1.05rem; }
  .btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.82rem;
    padding: 0.55rem 1rem;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    white-space: nowrap;
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
  }
  .btn-buy { background: var(--gold); color: var(--bg); }
  .btn-buy:hover { transform: translateY(-2px); }
  .btn-ask { border-color: var(--violet); color: var(--violet); }
  .btn-ask:hover { background: var(--violet-bg); }
  .btn-disabled { border-color: var(--border); color: var(--text-dim); cursor: not-allowed; }

  /* ---------- FOOTER ---------- */
  .footer { margin-top: clamp(3rem, 8vw, 5rem); border-top: 1px solid var(--border); padding-block: clamp(2.5rem, 6vw, 4rem); }
  .footer-inner { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1rem; }
  .footer-heading { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 4vw, 2.2rem); }
  .footer-sub { color: var(--text-muted); max-width: 40ch; }
  .footer-cta {
    margin-top: 0.5rem;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--gold);
    color: var(--bg);
    font-weight: 600;
    padding: 0.75rem 1.5rem;
    border-radius: var(--radius-sm);
    transition: transform .2s ease;
  }
  .footer-cta:hover { transform: translateY(-2px); }
  .footer-meta {
    margin-top: 2rem;
    display: flex;
    gap: 1.25rem;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }
  .footer-meta a:hover { color: var(--gold); }
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-name" id="navName">Artist Name</span>
  <a class="nav-contact" id="navContact" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.07-1.32A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.6 0-3.1-.43-4.4-1.18l-.32-.19-3.13.82.84-3.04-.2-.32A7.94 7.94 0 014 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8z"/></svg>
    WhatsApp
  </a>
</nav>

<header class="hero container">
  <p class="hero-eyebrow">Original Beat Catalog</p>
  <h1 class="hero-name" id="heroName">Artist Name</h1>
  <p class="hero-tagline" id="heroTagline">Original beats, mixed and ready to license.</p>
  <a href="#browseSection" class="hero-cta">Browse the catalog ↓</a>
  <div class="hero-wave" id="heroWave" aria-hidden="true"></div>
</header>

<main id="browseSection">
  <section class="filters-section">
    <div class="container">
      <div class="filters-row" id="filtersRow" role="group" aria-label="Filter beats by availability"></div>
      <p class="result-count" id="resultCount"></p>
    </div>
  </section>

  <section class="catalog-section">
    <div class="container">
      <div class="catalog" id="catalog"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <h2 class="footer-heading">Want a custom beat?</h2>
    <p class="footer-sub">Tell me the vibe you're going for and I'll put something together.</p>
    <a class="footer-cta" id="footerContact" href="#" target="_blank" rel="noopener">Message on WhatsApp</a>
    <div class="footer-meta">
      <span id="footerCopyright">© 2026 Artist Name</span>
      <a id="footerInstagram" href="#" target="_blank" rel="noopener" style="display:none;">Instagram</a>
       <a id="footerFacebook" href="#" target="_blank" rel="noopener" style="display:none;">Facebook</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vuytknwphxqmawcnbmrb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5AWfRcG4vFWcMy2IyeGffw_17XspIjP";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CONFIG = {
  producerName: "IBRHM",
  tagline: "Original beats, mixed and ready to license. Press play on any track, then send a message to lock one in.",
  whatsappNumber: "8801931191173",
  catalogPrefix: "BM",
  instagram: "https://www.instagram.com/ibrhmusic.wav?igsi=MWZqc3htdHQydWN5eQ==",
  facebook: "https://www.facebook.com/ibrhm.onthebeat"
};

let BEATS = [];


const STATUS = {
  available: { label: "Available", tone: "gold" },
  sold:      { label: "Sold Out", tone: "red" }
};

const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

const COVER_GRADIENTS = [
  'linear-gradient(135deg,#6C4BA6,#241B3D)',
  'linear-gradient(135deg,#E8A33D,#5C3A1F)',
  'linear-gradient(135deg,#E8483A,#5C1A2E)',
  'linear-gradient(135deg,#4B6BA6,#20163D)',
  'linear-gradient(135deg,#C24BA6,#241B4D)',
  'linear-gradient(135deg,#E8A33D,#5C1A2E)'
];

let currentAudio = null;
let currentBtn = null;

function waNumber() { return CONFIG.whatsappNumber.replace(/[^0-9]/g, ''); }
function waLink(message) { return `https://wa.me/${waNumber()}?text=${encodeURIComponent(message)}`; }

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function applyConfig() {
  document.title = `${CONFIG.producerName} — Beat Catalog`;
  document.getElementById('navName').textContent = CONFIG.producerName;
  document.getElementById('heroName').textContent = CONFIG.producerName;
  document.getElementById('heroTagline').textContent = CONFIG.tagline;
  document.getElementById('navContact').href = waLink("Hi! I have a question about your beats.");
  document.getElementById('footerContact').href = waLink("Hi! I'd like to talk about a custom beat.");
  document.getElementById('footerCopyright').textContent =
    `© ${new Date().getFullYear()} ${CONFIG.producerName}. All beats original productions.`;

  if (CONFIG.instagram) {
    const ig = document.getElementById('footerInstagram');
    ig.href = CONFIG.instagram;
    ig.style.display = 'inline';
  }
  if (CONFIG.facebook) {
    const fb = document.getElementById('footerFacebook');
    fb.href = CONFIG.facebook;
    fb.style.display = 'inline';
  }
}

function countFor(status) {
  return status === 'all' ? BEATS.length : BEATS.filter(b => b.status === status).length;
}

function buildFilters() {
  const row = document.getElementById('filtersRow');
  const groups = [{ key: 'all', label: 'All Beats' }, ...Object.entries(STATUS).map(([key, v]) => ({ key, label: v.label }))];
  row.innerHTML = groups.map((g, i) => `
    <button class="filter-btn${i === 0 ? ' active' : ''}" data-filter="${g.key}" aria-pressed="${i === 0 ? 'true' : 'false'}">${g.label} (${countFor(g.key)})</button>
  `).join('');

  row.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      row.querySelectorAll('.filter-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      renderCatalog(btn.dataset.filter);
    });
  });
}

function footerAction(beat) {
  const code = `${CONFIG.catalogPrefix}-${beat.code}`;
  if (beat.status === 'available') {
    const msg = `Hi! I'm interested in "${beat.title}" (${code}). Is it still available?`;
    return `<a class="btn btn-buy" href="${waLink(msg)}" target="_blank" rel="noopener">Buy on WhatsApp</a>`;
  }
  return `<span class="btn btn-disabled">Sold Out</span>`;
}

function cardHTML(beat, idx) {
  const st = STATUS[beat.status];
  const gradient = COVER_GRADIENTS[idx % COVER_GRADIENTS.length];
  const hasAudio = Boolean(beat.audio);
  const code = `${CONFIG.catalogPrefix}-${beat.code}`;
  const safeTitle = escapeHtml(beat.title);
  return `
    <article class="card" data-status="${beat.status}">
      <div class="cover" style="background:${gradient}">
        <span class="tag-code">${code}</span>
        <span class="tag-status tone-${st.tone}">${st.label}</span>
        <button class="play-btn" data-has-audio="${hasAudio}" data-title="${safeTitle}" aria-label="Play preview of ${safeTitle}">${ICON_PLAY}</button>
        <span class="no-preview-msg">Preview coming soon</span>
        <audio class="audio-el" ${hasAudio ? `src="${beat.audio}"` : ''} preload="none"></audio>
      </div>
      <div class="card-body">
        <h3 class="title">${safeTitle}</h3>
        <p class="meta">${escapeHtml(beat.genre || 'Original Production')} · ${beat.bpm ? `${escapeHtml(String(beat.bpm))} BPM` : 'BPM —'}</p>
        <div class="player-row">
          <div class="progress"><div class="progress-fill"></div></div>
          <span class="time">0:00</span>
        </div>
        <div class="card-footer">
          <span class="price">${beat.price}</span>
          ${footerAction(beat)}
        </div>
      </div>
    </article>
  `;
}

function renderCatalog(filter) {
  const grid = document.getElementById('catalog');
  const list = filter === 'all' ? BEATS : BEATS.filter(b => b.status === filter);
  grid.innerHTML = list.map((beat, i) => cardHTML(beat, i)).join('');
  document.getElementById('resultCount').textContent = `Showing ${list.length} of ${BEATS.length} beats`;

  currentAudio = null;
  currentBtn = null;

  grid.querySelectorAll('.card').forEach(card => {
    const audio = card.querySelector('.audio-el');
    const fill = card.querySelector('.progress-fill');
    const timeLabel = card.querySelector('.time');

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        timeLabel.textContent = formatTime(audio.currentTime);
      }
    });
    audio.addEventListener('ended', () => {
      fill.style.width = '0%';
      timeLabel.textContent = '0:00';
      const btn = card.querySelector('.play-btn');
      btn.innerHTML = ICON_PLAY;
      btn.setAttribute('aria-label', `Play preview of ${btn.dataset.title}`);
      if (currentAudio === audio) { currentAudio = null; currentBtn = null; }
    });
  });
}

document.getElementById('catalog').addEventListener('click', (e) => {
  const btn = e.target.closest('.play-btn');
  if (!btn) return;
  const cover = btn.closest('.cover');
  const audio = cover.querySelector('.audio-el');
  const msg = cover.querySelector('.no-preview-msg');

  function flashMessage(text) {
    msg.textContent = text;
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 1600);
  }

  if (btn.dataset.hasAudio !== 'true') {
    flashMessage('Preview coming soon');
    return;
  }

  if (currentAudio && currentAudio !== audio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    if (currentBtn) {
      currentBtn.innerHTML = ICON_PLAY;
      currentBtn.setAttribute('aria-label', `Play preview of ${currentBtn.dataset.title}`);
      const prevFill = currentBtn.closest('.cover').querySelector('.progress-fill');
      if (prevFill) prevFill.style.width = '0%';
    }
  }

  if (audio.paused) {
    audio.play().then(() => {
      btn.innerHTML = ICON_PAUSE;
      btn.setAttribute('aria-label', `Pause preview of ${btn.dataset.title}`);
      currentAudio = audio;
      currentBtn = btn;
    }).catch(() => {
      flashMessage("Couldn't load preview");
      currentAudio = null;
      currentBtn = null;
    });
  } else {
    audio.pause();
    btn.innerHTML = ICON_PLAY;
    btn.setAttribute('aria-label', `Play preview of ${btn.dataset.title}`);
    currentAudio = null;
    currentBtn = null;
  }
});

function buildWaveform() {
  const el = document.getElementById('heroWave');
  let bars = '';
  for (let i = 0; i < 44; i++) {
    const h = 15 + Math.random() * 85;
    const delay = (Math.random() * 1.2).toFixed(2);
    const dur = (0.8 + Math.random() * 0.8).toFixed(2);
    bars += `<div class="wave-bar" style="height:${h}%;animation-delay:${delay}s;animation-duration:${dur}s"></div>`;
  }
  el.innerHTML = bars;
}

async function loadBeats() {
  const grid = document.getElementById('catalog');
  grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:3rem 0;">Loading beats…</p>';

  const { data, error } = await supabaseClient
    .from('BEATS')
    .select('id, "Title", "Genre", "BPM", "Price", "Status", "Audio url"');

  if (error) {
    console.error(error);
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--red);padding:3rem 0;">Could not load beats. Check your Supabase table and permissions.</p>';
    return;
  }

  BEATS = (data || []).map((b, index) => ({
    code: String(b.id ?? index + 1).padStart(3, '0'),
    title: b['Title'] ?? 'Untitled Beat',
    genre: b['Genre'] ?? '',
    bpm: b['BPM'] ?? '',
    key: '',
    price: b['Price'] ?? null,
    status: String(b['Status'] ?? 'available').toLowerCase() === 'sold' ? 'sold' : 'available',
    audio: b['Audio url'] ?? ''
  }));

  buildFilters();
  renderCatalog('all');
}

applyConfig();
buildWaveform();
loadBeats();
</script>
</body>
</html>
